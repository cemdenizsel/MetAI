apiVersion: v1
kind: ConfigMap
metadata:
  name: metai-config
  namespace: metai
data:
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8084"
  MONGODB_CONNECTION_STRING: "mongodb://mongodb-service:27017"
  MONGODB_DATABASE: "metai"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Frontend Configuration
  NEXT_PUBLIC_API_URL: "http://api-service:8084"
