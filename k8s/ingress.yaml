apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metai-ingress
  namespace: metai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: metai-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - secretName: metai-tls
    hosts:
    - meetingai.info
    - be.meetingai.info
  rules:
  # Backend API route
  - host: be.meetingai.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8084
  # Frontend route
  - host: meetingai.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 3000
