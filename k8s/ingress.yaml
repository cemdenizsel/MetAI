apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metai-ingress
  namespace: metai
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - meetingai.info
    - be.meetingai.info
    secretName: metai-tls
  rules:
  # Backend API route
  - host: be.meetingai.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8084
  # Frontend route
  - host: meetingai.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 3000
