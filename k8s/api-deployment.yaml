apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: metai
  labels:
    app: api
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: wait-for-mongodb
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z mongodb-service 27017; do echo waiting for mongodb; sleep 2; done;']
      - name: wait-for-redis
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done;']
      containers:
      - name: api
        image: metai-api:latest  # Replace with your registry/image
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
          name: http
        env:
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: metai-config
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: metai-config
              key: API_PORT
        - name: MONGODB_CONNECTION_STRING
          valueFrom:
            configMapKeyRef:
              name: metai-config
              key: MONGODB_CONNECTION_STRING
        - name: MONGODB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: metai-config
              key: MONGODB_DATABASE
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: metai-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: metai-config
              key: REDIS_PORT
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: metai-secrets
              key: OPENAI_API_KEY
        - name: PAGEINDEX_API_KEY
          valueFrom:
            secretKeyRef:
              name: metai-secrets
              key: PAGEINDEX_API_KEY
        - name: OPIK_API_KEY
          valueFrom:
            secretKeyRef:
              name: metai-secrets
              key: OPIK_API_KEY
        - name: OPIK_WORKSPACE
          valueFrom:
            secretKeyRef:
              name: metai-secrets
              key: OPIK_WORKSPACE
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: metai-secrets
              key: JWT_SECRET_KEY
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: temp-uploads
          mountPath: /app/temp_uploads
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: api-logs-pvc
      - name: temp-uploads
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: metai
  labels:
    app: api
spec:
  type: ClusterIP
  ports:
  - port: 8084
    targetPort: 8084
    protocol: TCP
    name: http
  selector:
    app: api
