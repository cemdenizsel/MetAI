apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: metai
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: dogukangun/metai-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8084
          name: http
        envFrom:
        - configMapRef:
            name: metai-config
        - secretRef:
            name: metai-secrets
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: temp-uploads
          mountPath: /app/temp_uploads
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: logs
        emptyDir: {}
      - name: temp-uploads
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: metai
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
  - port: 8084
    targetPort: 8084
    name: http
  type: ClusterIP
