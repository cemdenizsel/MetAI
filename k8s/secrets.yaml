apiVersion: v1
kind: Secret
metadata:
  name: metai-secrets
  namespace: metai
type: Opaque
stringData:
  # Database
  MONGODB_CONNECTION_STRING: "mongodb://mongodb:27017"
  MONGODB_DATABASE: "emotion_analysis_db"
  MONGODB_CHAT_COLLECTION: "chat_sessions"

  # API Keys (will be populated by create-secrets.sh)
  OPENAI_API_KEY: ""
  LOCAL_LLM_API_KEY: "ollama"
  OPIK_API_KEY: ""
  PAGEINDEX_API_KEY: ""

  # Security (will be populated by create-secrets.sh)
  SECRET_KEY: ""

  # Email (will be populated by create-secrets.sh)
  EMAIL_PASSWORD: ""
