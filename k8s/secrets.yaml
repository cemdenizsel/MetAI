apiVersion: v1
kind: Secret
metadata:
  name: metai-secrets
  namespace: metai
type: Opaque
stringData:
  # OpenAI API Key
  OPENAI_API_KEY: "your-openai-api-key-here"
  
  # PageIndex API Key
  PAGEINDEX_API_KEY: "your-pageindex-api-key-here"
  
  # Opik API Key
  OPIK_API_KEY: "your-opik-api-key-here"
  OPIK_WORKSPACE: "your-opik-workspace"
  
  # JWT Secret
  JWT_SECRET_KEY: "your-jwt-secret-key-here"
  
  # MongoDB (if using authentication)
  # MONGODB_USERNAME: "admin"
  # MONGODB_PASSWORD: "password"
